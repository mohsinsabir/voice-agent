services:
  postgres:
    image: postgres:15-alpine
    container_name: voice-agent-db
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_agent
    ports:
      - "5432:5432"
    volumes:
      - voice_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 3 — post-call automation (optional; app uses hosted Supabase by default)
  n8n:
    image: n8nio/n8n:latest
    container_name: voice-agent-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Karachi
    volumes:
      - voice_n8n_data:/home/node/.n8n
    profiles:
      - n8n

volumes:
  voice_pg_data:
  voice_n8n_data:
