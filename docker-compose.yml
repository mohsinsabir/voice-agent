services:
  postgres:
    image: postgres:15-alpine
    container_name: voice-agent-db
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_agent
    ports:
      - "5432:5432"
    volumes:
      - voice_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voice_pg_data:
